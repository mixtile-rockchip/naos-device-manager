name: Release ARM64 Core
on:
  push:
    tags: ['20[0-9][0-9].*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      TARGET: aarch64-unknown-linux-musl
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_musl: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user dbus-daemon
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Run unit and integration tests
        run: cargo test --locked -- --include-ignored --test-threads=1
      - name: Build and verify the ARM64 release
        run: |
          python3 tools/release.py "$GITHUB_REF_NAME"
          qemu-aarch64 target/$TARGET/release/naos-core --help
          cd target/dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-release
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-release
      - name: Publish the verified package and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "NAOS Device Manager for ARM64 Linux." \
            naos-core-linux-arm64.tar.gz naos-core-linux-arm64.spdx.json SHA256SUMS
